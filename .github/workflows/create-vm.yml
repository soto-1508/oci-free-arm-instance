name: Try to Create OCI VM
# Each run queues the next one when it finishes.
on:
  # Allows you to manually run this workflow from the Actions tab
  workflow_dispatch:

permissions:
  actions: write
  contents: read
env:
  COMPARTMENT_ID: ${{ secrets.OCI_CLI_TENANCY }}
  IMAGE_ID: ${{ secrets.OCI_CLI_IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_CLI_SUBNET_ID }}
  AD_NAME: ${{ secrets.OCI_CLI_AD }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        # This forces the job to succeed so the cache will save.
        continue-on-error: true 
        run: |
          set -o pipefail

          pip install oci-cli

          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_CLI_USER }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "region=${{ env.OCI_CLI_REGION }}" >> ~/.oci/config
          echo "${{ secrets.SSH_PUBLIC_KEY }}" | tr -d '\r\n' > /home/runner/my_ssh_key.pub
          echo "" >> /home/runner/my_ssh_key.pub

          DISCORD_WEBHOOK="${{ secrets.DISCORD_WEBHOOK_URL }}"
          END_TIME=$((SECONDS + 21000)) # 5h 50m = 21000 segundos
          SUCCESS=0
          ATTEMPT=1

          while [ $SECONDS -lt $END_TIME ]; do
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Intento #$ATTEMPT: Intentando crear la máquina..."

            # Run the command, capture ALL output, and use '|| true' to prevent the script from exiting early.
            OCI_OUTPUT=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
              --assign-public-ip true \
              --display-name "bot-trading-server" \
              --boot-volume-size-in-gbs 200 2>&1 || true)

            if echo "$OCI_OUTPUT" | grep -q -E '"lifecycle-state": "(PROVISIONING|RUNNING)"'; then
              echo "¡ÉXITO! Máquina creada."
              SUCCESS=1
              break
            fi

            # Notificación de heartbeat a Discord cada 80 intentos (~1 hora)
            if (( ATTEMPT % 80 == 0 )); then
              ELAPSED_H=$(( (SECONDS) / 3600 ))
              ELAPSED_M=$(( (SECONDS % 3600) / 60 ))
              curl -s -X POST "$DISCORD_WEBHOOK" \
                -H "Content-Type: application/json" \
                -d "{\"content\": \"⏳ Sigo buscando servidor en Oracle... (Intento #$ATTEMPT | Tiempo transcurrido: ${ELAPSED_H}h ${ELAPSED_M}m)\"}"
            fi

            echo "Fallo (probablemente falta de capacidad). Esperando 45 segundos..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 45
          done

          # Store the log as a GitHub step output
          echo "log_data<<EOF" >> $GITHUB_OUTPUT
          echo "$OCI_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ $SUCCESS -eq 1 ]; then
            echo "Success! 'PROVISIONING' or 'RUNNING' state found in output."
            exit 0
          else
            echo "Se agotó el tiempo de esta ejecución. Volviendo a intentar en la próxima hora."
            exit 1
          fi

      - name: Send Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "OCI VM Status: ${{ steps.create_vm.outcome }}"
          status: ${{ steps.create_vm.outcome }}
          color: ${{ steps.create_vm.outcome == 'success' && '0x28a745' || '0xdc3545' }}
          description: |
            Attempt to create A1.Flex VM.
            **Status:** `${{ steps.create_vm.outcome }}`

            **Log Output:**
            ```json
            ${{ steps.create_vm.outputs.log_data }}
            ```


      - name: Queue next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run create-vm.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
